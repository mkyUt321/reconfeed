name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -v
        env:
          # Dummy values: unit tests never touch a real database, but app.config.Settings
          # (loaded at import time) requires these to be set to something syntactically valid.
          DATABASE_URL: postgresql://user:pass@localhost/testdb
          SESSION_SECRET: ci-test-secret
