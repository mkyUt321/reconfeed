services:
  - type: web
    name: reconfeed
    runtime: python
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NVD_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # sync: false rather than a hard-coded value so switching to a verified custom domain
      # is a dashboard edit. A `value:` here would be re-applied on every blueprint sync.
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: APP_BASE_URL
        sync: false
      # Set to false in the dashboard once a verified sender is in use, to drop the demo notice.
      - key: DEMO_MODE
        sync: false
